name: iOS build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run Rust/WASM tests
        run: npm test

      - name: Sync Capacitor iOS shell
        run: npm run cap:sync

      - name: Resolve Swift package dependencies
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload build products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: |
            ios/build/Build/Products/Debug-iphonesimulator/App.app
            ios/build/Logs/**
          if-no-files-found: warn
